# Builds the website (landing page plus the in-browser demo) and publishes it to
# the gh-pages branch, which GitHub Pages serves at
# https://euryalus-kay.github.io/Sportive-Scout/
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # push the gh-pages branch
  pages: write      # ask GitHub Pages to rebuild

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python website/build.py
      - name: Publish to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Website from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Ask GitHub Pages to rebuild
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pushes made with GITHUB_TOKEN may not start a Pages build on their own.
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            || echo "Could not request a build; Pages will pick up the push on its own."
