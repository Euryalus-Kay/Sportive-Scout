# Clean data-product look (white page, hairline borders, one blue accent).
[theme]
base = "light"
primaryColor = "#1652f0"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#0e1116"
borderColor = "#e6e8ec"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
linkColor = "#1652f0"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
headingFont = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#1652f0", "#eb6834", "#16a34a", "#9aa1aa"]
dataframeHeaderBackgroundColor = "#f8f9fa"

[theme.sidebar]
backgroundColor = "#fafbfc"

[server]
maxUploadSize = 4096

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
