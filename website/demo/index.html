<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sportive Scout Demo</title>
  <meta name="description" content="The Sportive Scout app running in your browser with made-up teams.">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css">
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #wait { position: fixed; inset: 0; display: grid; place-items: center; font: 15px/1.5 Inter, -apple-system,
            BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #5b6472; text-align: center; padding: 16px;
            pointer-events: none; transition: opacity .3s; }
    #wait b { display: block; color: #0e1116; font-size: 17px; margin-bottom: 4px; }
    #wait .bar { width: 180px; height: 3px; margin: 16px auto 0; background: #e6e8ec; border-radius: 3px;
                 overflow: hidden; position: relative; }
    #wait .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: #1652f0;
                        border-radius: 3px; animation: slide 1.2s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <div id="wait">
    <div>
      <b>Starting the demo</b>
      The app runs inside your browser, so the first visit downloads Python.<br>
      It takes about half a minute, and it's faster after that.
      <div class="bar"></div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

    // ?analysis=<name> opens a published analysis from ./analyses/<name>.zip (games.yaml + logs).
    const archives = [{ url: "./app.zip", format: "zip", options: {} }];
    const analysis = new URLSearchParams(location.search).get("analysis");
    if (analysis && /^[a-z0-9-]+$/.test(analysis)) {
      archives.push({ url: `./analyses/${analysis}.zip`, format: "zip", options: {} });
    }

    mount({
      entrypoint: "app.py",
      archives,
      requirements: ["plotly", "pyyaml", "matplotlib"],
      streamlitConfig: { "client.toolbarMode": "minimal", "browser.gatherUsageStats": false },
    }, document.getElementById("root"));

    // Hide the note once the app has drawn its first page.
    const wait = document.getElementById("wait");
    const seen = new MutationObserver(() => {
      if (document.querySelector('[data-testid="stAppViewContainer"] [data-testid="stHeading"], [data-testid="stMetric"], .pm-title')) {
        wait.style.opacity = "0";
        setTimeout(() => wait.remove(), 400);
        seen.disconnect();
      }
    });
    seen.observe(document.getElementById("root"), { childList: true, subtree: true });
  </script>
</body>
</html>
